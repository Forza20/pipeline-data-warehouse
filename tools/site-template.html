      (procs || []).forEach(function (p) { ul.appendChild(h('li', { title: 'defined in the migrations' }, [p + '()', h('span', { text: ' SQL procedure' })])); });
      return ul;
    }
    var rows = (D.agents || []).map(function (a) { return { cmd: '', agent: a.name, sub: 'step ' + a.step + ' · ' + a.status + (a.minutes != null ? ' · ' + a.minutes + ' min' : '') + (a.model ? ' · ' + a.model : ''),
      skills: a.skills, mcp: a.mcp, calls: a.calls, procs: a.procs, file: a.file }; });
    rows.push({ cmd: '', agent: 'orchestrator', sub: 'scorecard · ' + D.orchestrator.status, skills: D.orchestrator.skills, mcp: [], calls: D.orchestrator.calls, procs: [], file: D.orchestrator.file });
    rows.forEach(function (r, i) {
      g.appendChild(h('div', { class: 'cell' }, i === 0 ? [h('span', { class: 'fn a', text: '/messy-pipeline' }), h('br'), h('span', { class: 'muted', text: D.domain + ' ' + D.seed })] : []));
      g.appendChild(h('div', { class: 'cell', title: r.file }, [h('span', { class: 'fn', text: r.agent }), h('br'), h('span', { class: 'muted', text: r.sub })]));
      var sk = [h('span', { class: 'fn', text: r.skills.join(' · ') || '–' })];
      r.mcp.forEach(function (m) { sk.push(h('br')); sk.push(h('span', { class: 'muted', text: m.server + ': ' + m.tools.join(', ') })); });
      g.appendChild(h('div', { class: 'cell' }, sk));
      g.appendChild(h('div', { class: 'cell' }, [callList(r.calls, r.procs)]));
    });
    s.appendChild(h('div', { class: 'board' }, [g]));
    if (D.tempTables.length) s.appendChild(h('p', { class: 'muted', style: 'font-size:13px', text: 'Temp tables in silver: ' + D.tempTables.join(', ') + '.' }));
  })();

  /* ---------- model ---------- */
  (function () {
    var s = view('model'); title(s, 'Data model', 'The star schema in the Power BI model: ' + D.tables.length + ' tables and ' + D.rels.length + ' relationships, all many-to-one from the facts.');
    var W = 1000, Hh = 560, pos = {}, bw = 200, bh = 46;
    var facts = D.tables.filter(function (t) { return t.kind === 'Fact'; }), others = D.tables.filter(function (t) { return t.kind !== 'Fact'; });
    facts.forEach(function (t, i) { pos[t.name] = { x: W / 2 - bw / 2, y: 150 + i * 170 }; });
    var left = [], right = []; others.forEach(function (t, i) { (i % 2 ? right : left).push(t); });
    [[left, 40], [right, W - 40 - bw]].forEach(function (col) { col[0].forEach(function (t, i) { pos[t.name] = { x: col[1], y: 40 + i * ((Hh - 80) / Math.max(1, col[0].length - 1 || 1)) }; }); });
    var svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="Data model">';
    var tn = function (x) { return (x || '').split('[')[0]; };
    D.rels.forEach(function (r) { var a = pos[tn(r.from)], b = pos[tn(r.to)]; if (!a || !b) return;
      svg += '<path class="rel' + (r.active ? '' : ' off') + '" d="M' + (a.x + bw / 2) + ' ' + (a.y + bh / 2) + ' L' + (b.x + bw / 2) + ' ' + (b.y + bh / 2) + '"/>'; });
    D.tables.forEach(function (t) { var p = pos[t.name]; if (!p) return; var cls = t.kind === 'Fact' ? 'fact' : t.kind === 'Bridge' ? 'bridge' : '';
      svg += '<g class="ent ' + cls + '" transform="translate(' + p.x + ',' + p.y + ')"><rect class="box" width="' + bw + '" height="' + bh + '" rx="8"/><text class="ttl" x="12" y="20">' + t.name + '</text><text class="k" x="12" y="37">' + t.kind + '</text></g>'; });
    svg += '</svg>';
    var b = h('div', { class: 'board model' }); b.innerHTML = svg; s.appendChild(b);
    s.appendChild(h('h3', { text: 'Relationships' }));
    var tb = h('tbody'); D.rels.forEach(function (r) { tb.appendChild(h('tr', {}, [h('td', { class: 'mono', text: r.from }), h('td', { class: 'mono', text: r.to }), h('td', { text: (r.card || '') + (r.active ? '' : ' · inactive') })])); });
    s.appendChild(h('div', { class: 'board' }, [h('table', { class: 't' }, [h('thead', {}, [h('tr', {}, [h('th', { text: 'From' }), h('th', { text: 'To' }), h('th', { text: 'Cardinality' })])]), tb])]));
  })();

  /* ---------- quality ---------- */
  (function () {
    var s = view('quality'); title(s, 'Data quality', 'What the quality rules caught, and all ' + D.quality.length + ' checks of the run. Error checks must return 0; info checks are known, explained exceptions.');
    if (D.infos.length) {
      s.appendChild(h('h3', { text: 'Problems found (info checks)' }));
      var nums = D.infos.map(function (i) { return Number(String(i.res).replace(/[^\d]/g, '')) || 0; }), mx = Math.max.apply(null, nums.concat([1]));
      var tb = h('tbody'); D.infos.forEach(function (i, k) { var bar = h('div', { class: 'bar' }, [h('i', { style: 'width:' + Math.max(1.5, 100 * nums[k] / mx) + '%' })]);
        tb.appendChild(h('tr', {}, [h('td', { text: i.chk }), h('td', { class: 'r mono', text: i.res }), h('td', {}, [bar])])); });
      s.appendChild(h('div', { class: 'board' }, [h('table', { class: 't' }, [h('thead', {}, [h('tr', {}, [h('th', { text: 'Rule' }), h('th', { class: 'r', text: 'Rows' }), h('th', { text: '' })])]), tb])]));
    }
    s.appendChild(h('h3', { text: 'All checks' }));
    var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter checks' });
    var errs = D.quality.filter(function (q) { return q.lvl === 'ERR'; }).length;
    [['all', 'All ' + D.quality.length], ['ERR', 'Error checks (' + errs + ')'], ['INFO', 'Info (' + (D.quality.length - errs) + ')']].forEach(function (x, i) { seg.appendChild(h('button', { type: 'button', 'data-q': x[0], 'aria-pressed': i ? 'false' : 'true', text: x[1] })); });
    s.appendChild(h('div', { class: 'tools' }, [seg]));
    var body = h('tbody');
    function render(f) { body.textContent = ''; D.quality.forEach(function (c) { if (f !== 'all' && c.lvl !== f) return; var bad = c.lvl === 'ERR' && c.res !== '0';
      body.appendChild(h('tr', {}, [h('td', { class: 'mono', text: String(c.no) }), h('td', {}, [h('span', { class: 'pill ' + (bad ? 'warn' : c.lvl === 'ERR' ? 'ok' : 'care'), text: c.lvl === 'ERR' ? (bad ? 'error' : 'error check') : 'info' })]), h('td', { text: c.chk }), h('td', { class: 'r mono', text: c.res })])); }); }
    render('all');
    seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); render(b.getAttribute('data-q')); });
    s.appendChild(h('div', { class: 'board' }, [h('table', { class: 't' }, [h('thead', {}, [h('tr', {}, [h('th', { text: '#' }), h('th', { text: 'Type' }), h('th', { text: 'Check' }), h('th', { class: 'r', text: 'Result' })])]), body])]));
  })();

  /* ---------- runs ---------- */
  (function () {
    var s = view('runs'); title(s, 'Runs', 'All runs of the pipeline. Every run tests the skills on a new messy dataset; the fixes from the scorecard make the next run better.');
    var tb = h('tbody'); D.runs.forEach(function (r) { tb.appendChild(h('tr', {}, [h('td', { class: 'mono', text: r.date + ' ' + r.id }), h('td', { text: r.domain + ' · ' + r.seed }), h('td', { class: 'r', text: r.rows }), h('td', { class: 'mono', text: r.types }), h('td', { class: 'r', text: r.found }), h('td', { text: r.stops }), h('td', {}, [h('span', { class: 'pill ' + (/^Passed/.test(r.result) ? 'ok' : 'care'), text: r.result })])])); });
    s.appendChild(h('div', { class: 'board' }, [h('table', { class: 't' }, [h('thead', {}, [h('tr', {}, ['Run', 'Domain', 'Rows', 'Error types', 'Found', 'Stops', 'Result'].map(function (x, i) { return h('th', { class: i === 2 || i === 4 ? 'r' : '', text: x }); }))]), tb])]));
    var stops = D.runs.slice().reverse().map(function (r) { return { id: r.id, n: parseInt(r.stops, 10) }; }).filter(function (x) { return !isNaN(x.n); });
    if (stops.length) {
      var mx = Math.max.apply(null, stops.map(function (x) { return x.n; }).concat([1])), tr = h('div', { class: 'trend', 'aria-label': 'Stops for the user per run' });
      stops.forEach(function (x) { tr.appendChild(h('div', { class: 'col' }, [h('span', { class: 'val', text: String(x.n) }), h('div', { class: 'b' + (x.n ? '' : ' zero'), style: 'height:' + (x.n ? Math.round(90 * x.n / mx) : 3) + 'px' }), h('span', { class: 'lab', text: x.id })])); });
      s.appendChild(h('h3', { text: 'Stops for the user per run' }));
      var pad = h('div', { class: 'board pad' }, [tr]); if (D.neverTested) pad.appendChild(h('p', { class: 'muted', style: 'font-size:13px;margin:14px 0 0', text: 'Error types never tested at full size: ' + D.neverTested }));
      s.appendChild(pad);
    }
  })();

  /* ---------- catalog ---------- */
  (function () {
    var L = D.catLayers || [], nT = 0, nC = 0;
    L.forEach(function (l) { nT += l.tables.length; l.tables.forEach(function (t) { nC += t.cols.length; }); });
    var s = view('catalog'); title(s, 'Data catalog', nf(nT) + ' tables and ' + nf(nC) + ' columns and measures in 4 layers – with owner, rows, update and every column. The examples are fetched from Supabase; possible PII columns are not shown.');
    var q = h('input', { id: 'q', class: 'search', type: 'search', placeholder: 'a table, a column, an owner or a word from a description', autocomplete: 'off' });
    var cnt = h('span', { class: 'count' });
    s.appendChild(h('div', { class: 'tools' }, [h('label', { class: 'sr', for: 'q', text: 'Search the catalog' }), q, cnt]));
    var active = (L.filter(function (l) { return l.key === 'gold'; })[0] || L[0] || {}).key;
    var chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Layer' });
    L.forEach(function (l) { chips.appendChild(h('button', { type: 'button', 'data-l': l.key, 'aria-pressed': l.key === active ? 'true' : 'false', text: l.label + ' ' + l.tables.length })); });
    s.appendChild(chips);
    var list = h('div', { class: 'board' }); s.appendChild(list);
    function hit(t, w) { if (!w) return true; var hay = [t.name, t.kind, t.desc, t.owner, t.sub].concat(t.cols.map(function (c) { return c.n + ' ' + c.d + ' ' + c.ex; })).join(' ').toLowerCase(); return hay.indexOf(w) >= 0; }
    function render() {
      var w = q.value.trim().toLowerCase(), layer = L.filter(function (l) { return l.key === active; })[0], shown = 0; list.textContent = '';
      (layer ? layer.tables : []).forEach(function (t) {
        if (!hit(t, w)) return; shown++;
        var meta = h('span', { class: 'meta' }, [h('span', { text: t.owner || 'no owner' }), t.rows != null ? h('span', { text: nf(t.rows) + ' rows' }) : null, t.date ? h('span', { text: t.date }) : null, h('span', { text: t.cols.length + ' columns' })]);
        var sum = h('summary', {}, [h('span', {}, [h('span', { class: 'tn', text: t.name }), t.kind ? h('span', { class: 'kind', text: t.kind.toLowerCase() }) : null]), meta,
          h('span', { class: 'td', text: [t.desc, t.sub].filter(Boolean).join(' · ') || '–' })]);
        var tb = h('tbody');
        t.cols.forEach(function (c) { tb.appendChild(h('tr', {}, [h('td', { class: 'mono', text: c.n }), h('td', { class: 'mono muted', text: c.t || '–' }), h('td', { class: 'mono', text: c.k }),
          h('td', { class: 'mono', text: c.ex || '' }), h('td', { title: c.dax || '', text: c.d || '' })])); });
        var det = h('details', { class: 'ctab' }, [sum, h('div', { class: 'cols' }, [h('table', { class: 't' }, [h('thead', {}, [h('tr', {}, ['Column', 'Type', 'Key', 'Example', 'Description'].map(function (x) { return h('th', { text: x }); }))]), tb])])]);
        if (shown === 1 || w) det.open = true;
        list.appendChild(det);
      });
      if (!shown) list.appendChild(h('div', { class: 'empty', text: 'No tables in this layer match the search.' }));
      cnt.textContent = shown + ' tables';
    }
    q.addEventListener('input', render);
    chips.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; active = b.getAttribute('data-l'); chips.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); render(); });
    render();
  })();

  document.getElementById('foot').append(h('span', { text: 'Built ' + D.built + ' by tools/build-site.js from run.json, scorecard, quality-results.md, catalog.json and the migrations of ' + D.id + '.' }),
    D.screenshot ? h('span', { text: 'Screenshot: ' + D.screenshot }) : null);

  var views = ['overview', 'architecture', 'lineage', 'callgraph', 'model', 'quality', 'runs', 'catalog'];
  function show() { var v = (location.hash || '').replace('#', ''); if (views.indexOf(v) < 0) v = 'overview';
    document.querySelectorAll('section[data-view]').forEach(function (x) { x.hidden = x.getAttribute('data-view') !== v; });
    document.querySelectorAll('nav a').forEach(function (a) { if (a.getAttribute('href') === '#' + v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
  window.addEventListener('hashchange', function () { show(); window.scrollTo(0, 0); });
  show();
})();
</script>
